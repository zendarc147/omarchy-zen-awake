<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Keep Awake for Omarchy</title>
  <desc id="desc">A dark copper-accented banner showing a laptop, a two-hour timer, and lid-closed playback.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1017"/>
      <stop offset="1" stop-color="#17121a"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2bd8f"/>
      <stop offset="1" stop-color="#c8744f"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#e6a46d" stop-opacity=".24"/>
      <stop offset="1" stop-color="#e6a46d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="965" cy="205" r="245" fill="url(#glow)"/>

  <g transform="translate(82 80)">
    <rect x="0" y="0" width="62" height="28" rx="14" fill="#e6a46d" fill-opacity=".14" stroke="#e6a46d" stroke-opacity=".5"/>
    <circle cx="18" cy="14" r="5" fill="#84c79b"/>
    <text x="31" y="19" fill="#d9cbc0" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700" letter-spacing="1">ON</text>

    <text x="0" y="112" fill="#f5ede4" font-family="Inter,Segoe UI,sans-serif" font-size="64" font-weight="800" letter-spacing="-2">KEEP AWAKE</text>
    <text x="2" y="153" fill="#a8a3ad" font-family="Inter,Segoe UI,sans-serif" font-size="22">Close the lid. Keep the moment going.</text>

    <g transform="translate(0 196)">
      <rect width="150" height="54" rx="14" fill="#ffffff" fill-opacity=".055" stroke="#ffffff" stroke-opacity=".09"/>
      <circle cx="26" cy="27" r="8" fill="#e6a46d"/>
      <text x="45" y="34" fill="#f5ede4" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700">2h toggle</text>
    </g>
    <g transform="translate(166 196)">
      <rect width="170" height="54" rx="14" fill="#ffffff" fill-opacity=".055" stroke="#ffffff" stroke-opacity=".09"/>
      <path d="M23 21v12M17 27h12" stroke="#84c79b" stroke-width="3" stroke-linecap="round"/>
      <text x="44" y="34" fill="#f5ede4" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700">30 min</text>
    </g>
  </g>

  <g transform="translate(775 68)" filter="url(#shadow)">
    <path d="M72 36h244a18 18 0 0 1 18 18v184H54V54a18 18 0 0 1 18-18Z" fill="#171b23" stroke="url(#copper)" stroke-width="4"/>
    <rect x="74" y="57" width="240" height="160" rx="8" fill="#0a0c11"/>
    <circle cx="194" cy="137" r="54" fill="#e6a46d" fill-opacity=".12"/>
    <path d="M210 95a45 45 0 1 0 29 75 51 51 0 0 1-29-75Z" fill="url(#copper)"/>
    <text x="194" y="199" text-anchor="middle" fill="#d9cbc0" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700" letter-spacing="2">02:00</text>
    <path d="M24 238h340l34 38c7 8 1 20-10 20H0c-11 0-17-12-10-20Z" fill="#242934" stroke="#3c414d" stroke-width="2"/>
    <path d="M140 251h108" stroke="#e6a46d" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
  </g>

  <path d="M0 392h1200" stroke="#e6a46d" stroke-opacity=".22" stroke-width="2"/>
</svg>
